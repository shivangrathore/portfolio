server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve clean URLs produced by Astro's static build
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Long-cache hashed assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
