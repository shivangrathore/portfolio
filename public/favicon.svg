<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Shivang Rathore">
  <!--
    v5 mark: the Archivo S, at the same axis settings the wordmark and every
    headline on the site use (wdth 125, wght 800). It is the site's own
    letterform rather than a drawn approximation, so the tab icon, the masthead
    and the display type are all the same S.

    Outlined from src/assets/fonts/archivo-latin-wdth-wght.woff2 with fontTools
    and baked to a path on purpose: an SVG favicon cannot load a web font, so a
    <text> node would fall back to whatever each OS calls sans-serif and render
    differently on every machine.

    Square, not rounded, because the whole site is built from right angles. The
    ink box is centred rather than the advance width, since Archivo's S has
    asymmetric sidebearings and centring on the advance leaves it visibly left.

    To regenerate after a palette or axis change, see scripts/make-favicon.py.
  -->
  <rect width="32" height="32" fill="#2f6eff"/>
